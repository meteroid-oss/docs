# Meteroid's SDKs, as published: @meteroid/node, meteroid (PyPI), meteroid-go, com.meteroid,
# Meteroid (NuGet), meteroid-rs. `perseid-docs build` reads it for names and samples.
spec = "https://api.meteroid.com/api-docs/openapi.json"
name = "Meteroid"
sdks = ["typescript", "python", "go", "java", "csharp", "rust"]
base_url = "https://api.meteroid.com"

[[pagination]]
page = "page"
total_pages = "pagination_meta.total_pages"
first_page = 0

[[pagination]]
offset = "offset"
total = "total_count"

[typescript]
package = "@meteroid/node"

[go]
module = "github.com/meteroid-oss/meteroid-go"

[rust]
package = "meteroid-rs"
